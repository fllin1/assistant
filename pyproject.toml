[project]
name = "assistant"
version = "0.1.0"
description = "Local screen capture and input control helpers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mss>=9.0",
    "Pillow>=10.0",
    "typer>=0.9.0",
    "pyautogui>=0.9.54",
    "pydantic>=2.12.5",
    "pymupdf>=1.24",
]

[project.scripts]
assistant = "assistant.cli:app"
lnvo = "automations.ln_voice_over.cli:app"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["assistant*", "automations*"]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "PTH",   # prefer pathlib over os.path
    "T20",   # no print() left in code
    "ERA",   # no commented-out code
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]  # demo/utility scripts can print
"automations/ln_voice_over/scripts/*" = ["T20"]  # skill helpers print JSON/errors
"automations/ln_voice_over_v2/stages/prepare/ocr.py" = ["RUF001"]  # curly apostrophe is load-bearing in the refusal regex
"tests/automations/ln_voice_over_v2/stages/prepare/test_refusal_detection.py" = ["RUF001"]  # verbatim historical refusal transcripts use curly apostrophes

[tool.ruff.lint.isort]
known-first-party = ["assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires a display (deselected by default)"]
addopts = "-m 'not live'"
