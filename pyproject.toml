[project]
name = "assistant"
version = "0.1.0"
description = "A computer control agent with vision-based screen understanding"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mss>=9.0",
    "Pillow>=10.0",
    "typer>=0.9.0",
    "pyautogui>=0.9.54",
    "google-genai>=1.0",
    "ollama>=0.4.0",
]

[project.scripts]
assistant = "assistant.cli:app"

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "PTH",   # prefer pathlib over os.path
    "T20",   # no print() left in code
    "ERA",   # no commented-out code
    "RUF",   # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]  # demo/utility scripts can print

[tool.ruff.lint.isort]
known-first-party = ["assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires a display (deselected by default)"]
addopts = "-m 'not live'"
